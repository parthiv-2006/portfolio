  <!--
    Theme bootstrap. Runs before first paint so a saved "day" theme never
    flashes the dark palette on load.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('pp-theme') || 'night';
        document.documentElement.dataset.theme = saved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', saved === 'day' ? '#EFE9DD' : '#111110');
      } catch (e) { }
    })();
  </script>
</head>
